[loggers]
keys=root

[handlers]
keys=richHandler

[formatters]
keys=richFormatter

[logger_root]
level=DEBUG
handlers=richHandler

[handler_richHandler]
class=rich.logging.RichHandler
level=DEBUG
formatter=richFormatter
args=()

[formatter_richFormatter]
format=%(name)s.%(funcName)s:%(lineno)d: %(message)s
datefmt=%Y-%m-%d %H:%M:%S 